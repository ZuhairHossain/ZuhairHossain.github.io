---
layout: default
---

{% if page.author_profile %}
<div class="page-layout">
  {% include author-profile.html %}
  <div class="page-content">
    {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
    {{ content }}
  </div>
</div>
{% else %}
<div class="page-layout--full page-content">
  {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
  {{ content }}
</div>
{% endif %}
