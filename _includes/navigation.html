<!-- ============================================
     NAVIGATION BAR
     - Fixed at the top of the page with glassmorphism effect
     - Contains: brand name (links to home), nav links from _data/navigation.yml,
       dark/light theme toggle, and mobile hamburger menu
     - To add/remove nav links, edit: _data/navigation.yml
     - To change the brand name, edit: site.author.name in _config.yml
     ============================================ -->
<nav class="site-nav">
  <div class="nav-inner">

    <!-- Brand / Logo - links back to home page -->
    <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>

    <!-- Navigation Links (loaded from _data/navigation.yml) -->
    <div class="nav-links" id="nav-links">

      <!-- Home link (always present) -->
      <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">Home</a>

      <!-- Dynamic links from _data/navigation.yml -->
      {% for link in site.data.navigation.main %}
        <a class="nav-link {% if page.url == link.url %}active{% endif %}" href="{{ link.url | relative_url }}">{{ link.title }}</a>
      {% endfor %}

      <!-- Dark/Light Mode Toggle Button -->
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light mode">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>

    <!-- Mobile Hamburger Menu (visible only on small screens) -->
    <button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</nav>
